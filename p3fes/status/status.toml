# Port status, rendered into progress.svg by p3fes/scripts/status_chart.py.
# Edit this file, then run:  python3 p3fes/scripts/status_chart.py
#
# States: "done" (working), "partial" (works with gaps, or unverified), "todo" (not reached / not emulated).

updated = "2026-10-21"

# EE code of SLUS_216.21 (from ps2_recomp's summary)
[code]
functions = 14628
recompiled = 14423     # translated to C++
hle = 205              # bound to runtime implementations (kernel, SIF, CD, pad, memory card libraries)

# snaku/Persona3-FES-Decompilation (a separate, readable-C decompilation; not used by the build)
[decomp]
functions_in_c = 986   # C function definitions in its src/ at 59d284e (2026-09-04)
commit = "59d284e"

# ---------------------------------------------------------------------------------------------------------------
# Panel 1: the executable's 14,628 functions (p3fes/p3fes_map.csv), grouped by the library or game module they
# belong to (names from the snaku decompilation). The first `match` regex that fits a name wins; named functions
# that match nothing join the group of the function before them (the linker keeps each library contiguous), and
# unnamed ones fall into the last group. The state says whether the port has exercised that code at run time.
# ---------------------------------------------------------------------------------------------------------------
[[module]]
panel = "Middleware"
name = "Sony SDK"
match = '^(i?sce|lib(kernl|gcc|c|m|mc2|pad|dbc|cdvd|graph|ipu|mpeg|sk|iberty|https)_|_start|_exit|_root)'
state = "done"
[[module]]
panel = "Middleware"
name = "CRI ADX"
match = '^(libadxe|adx|ADX|AHX|ahx|AIX|ACS|SJ|sj|cvFs|dvCi|htCi|mfCi)'
state = "done"
[[module]]
panel = "Middleware"
name = "CRI Sofdec"
match = '^(libmwsfde|mw|MW|SF|sf|MPV|mpv|MPS|mps|viBuf)'
state = "done"
[[module]]
panel = "Middleware"
name = "CRI ROFS"
match = '^(librofs|ROFS|RF|rf|cvmh|CVMH|dcf|ROCI)'
state = "done"
[[module]]
panel = "Middleware"
name = "RenderWare"
match = '^(librw|librp|librt|Rw|Rp|Rt|rw)'
state = "partial"
[[module]]
panel = "Game"
name = "Engine core"
match = '^(H_|h_|kwln|main$|initAndLoop|gc_|gm)'
state = "partial"
[[module]]
panel = "Game"
name = "Battle"
match = '^(btl|battle|b[a-z]{1,4}_)'
state = "todo"
[[module]]
panel = "Game"
name = "Facilities"
match = '^fcl'
state = "todo"
[[module]]
panel = "Game"
name = "Models / FX"
match = '^(mdl|eff|prim)'
state = "partial"
[[module]]
panel = "Game"
name = "Scripts / events"
match = '^(scr|mt_|MT|nm[A-Z])'
state = "partial"
[[module]]
panel = "Game"
name = "Calendar / data"
match = '^(dat|clnd)'
state = "todo"
[[module]]
panel = "Game"
name = "UI / text"
match = '^(itf|fr[A-Z]|fm[A-Z])'
state = "partial"
[[module]]
panel = "Game"
name = "Social"
match = '^(comu|Comu)'
state = "todo"
[[module]]
panel = "Game"
name = "Other game code"
match = '$^'
state = "todo"

